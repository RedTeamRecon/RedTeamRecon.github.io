<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Davnel2166 Portfolio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gray-900 text-white font-sans">

    <!-- Hero Section -->
    <section class="hero-section p-8 text-center">
        <h1 id="about-heading">Welcome to My Portfolio</h1>
        <img id="profile-img" src="avatar.png" alt="Profile" class="w-32 h-32 mx-auto rounded-full my-4">
        <p class="text-gray-400">Cybersecurity & Software Development Projects</p>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="p-8 max-w-4xl mx-auto">
        <h2 class="text-2xl font-bold mb-4">Projects</h2>
        <!-- New project paragraphs will be dynamically appended here -->
    </section>

    <!-- Contact Form Section -->
    <section class="p-8 max-w-md mx-auto">
        <h2 class="text-2xl font-bold mb-4">Contact Me</h2>
        <form id="contact-form" class="flex flex-col gap-4">
            <input type="text" id="name" placeholder="Your Name" required class="p-2 rounded bg-gray-800 border border-gray-700" />
            <input type="email" id="email" placeholder="Your Email" required class="p-2 rounded bg-gray-800 border border-gray-700" />
            <textarea id="message" placeholder="Your Message" required class="p-2 rounded bg-gray-800 border border-gray-700"></textarea>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white p-2 rounded font-semibold transition">Send Message</button>
            <div id="form-status" class="mt-2 text-sm"></div>
        </form>
    </section>

    <!-- Link the JavaScript file with 'defer' so it runs after the DOM is parsed -->
    <script src="script.js" defer></script>
</body>
</html>
